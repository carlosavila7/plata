server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # SPA — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → api service (strip the /api prefix)
    location /api/ {
        proxy_pass         http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Service worker and manifest must never be cached — browser needs fresh copies to detect updates.
    location ~* (sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Content-Type "application/manifest+json";
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache hashed static assets aggressively (Vite fingerprints their names).
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
